// ---------- POMOĆNE FUNKCIJE ----------
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLon = (b.lon - a.lon) * Math.PI/180;
  const la1 = a.lat * Math.PI/180, la2 = b.lat * Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// Nearest Neighbor
function nearestNeighbor(start) {
  const n = tacke.length;
  const visited = new Array(n).fill(false);
  const route = [start];
  visited[start] = true;
  let cur = start;
  for (let k = 1; k < n; k++) {
    let best = -1, bestD = Infinity;
    for (let j = 0; j < n; j++) {
      if (visited[j]) continue;
      const d = haversine(tacke[cur], tacke[j]);
      if (d < bestD) { bestD = d; best = j; }
    }
    route.push(best);
    visited[best] = true;
    cur = best;
  }
  return route;
}

// 2-opt poboljšanje
function twoOpt(route) {
  const n = route.length;
  let improved = true, iter = 0;
  while (improved && iter < 20) {
    improved = false; iter++;
    for (let i = 1; i < n - 1; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = tacke[route[i-1]], b = tacke[route[i]];
        const c = tacke[route[j]], d = tacke[route[(j+1) % n]];
        const before = haversine(a,b) + haversine(c,d);
        const after  = haversine(a,c) + haversine(b,d);
        if (after < before - 0.001) {
          let l = i, r = j;
          while (l < r) { [route[l], route[r]] = [route[r], route[l]]; l++; r--; }
          improved = true;
        }
      }
    }
  }
  return route;
}

function routeDistance(route) {
  let d = 0;
  for (let i = 1; i < route.length; i++) d += haversine(tacke[route[i-1]], tacke[route[i]]);
  return d;
}

// ---------- PRIKAZ RUTE ----------
let trenutnaRuta = []; // niz indeksa u tacke
let ukupnaDistanca = 0;

function nacrtajRutuOSRM(coordsLatLng) {
  routeLayer.clearLayers();
  if (!coordsLatLng || coordsLatLng.length === 0) return;
  L.polyline(coordsLatLng, { color: '#0288d1', weight: 4, opacity: 0.85 }).addTo(routeLayer);
}

function nacrtajRutuPraveLinije(route) {
  routeLayer.clearLayers();
  const latlngs = route.map(i => [tacke[i].lat, tacke[i].lon]);
  L.polyline(latlngs, {
    color: '#e67e22', weight: 3, opacity: 0.8, dashArray: '6,6'
  }).addTo(routeLayer);
}

function dodajBrojeveNaRutu(route) {
  route.forEach((idx, pozicija) => {
    const t = tacke[idx];
    const jeStart = pozicija === 0;
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${jeStart ? '#e74c3c' : '#0288d1'};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.6);">${pozicija + 1}</div>`,
      iconSize: [26,26], iconAnchor: [13,13]
    });
    L.marker([t.lat, t.lon], { icon, zIndexOffset: 1000 })
      .bindPopup(`<b>${pozicija + 1}. ${t.naziv}</b><br>${t.opstina} — ${t.region}<br>Lat: ${t.lat}, Lon: ${t.lon}`)
      .addTo(routeLayer);
  });
}

function popuniListu(route) {
  const list = document.getElementById('routeList');
  list.innerHTML = '';
  route.forEach((idx, i) => {
    const t = tacke[idx];
    const div = document.createElement('div');
    div.className = 'route-item' + (i === 0 ? ' start' : '');
    div.innerHTML = `<div class="num">${i + 1}</div><div class="name">${t.naziv}</div>`;
    div.onclick = () => map.setView([t.lat, t.lon], 16);
    list.appendChild(div);
  });
}

// ---------- OSRM ruta preko puteva ----------
async function fetchOSRMRoute(route) {
  const CHUNK = 80;
  const allCoords = [];
  for (let i = 0; i < route.length - 1; i += CHUNK - 1) {
    const chunk = route.slice(i, Math.min(i + CHUNK, route.length));
    if (chunk.length < 2) break;
    const coords = chunk.map(idx => `${tacke[idx].lon},${tacke[idx].lat}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
    const data = await res.json();
    if (!data.routes || !data.routes[0]) throw new Error('Nema rute');
    const geom = data.routes[0].geometry.coordinates;
    for (let k = (i === 0 ? 0 : 1); k < geom.length; k++) {
      allCoords.push([geom[k][1], geom[k][0]]);
    }
  }
  return allCoords;
}

// ---------- DUGMAD ----------
document.getElementById('btnRoute').onclick = async () => {
  const loading = document.getElementById('loading');
  loading.style.display = 'block';
  try {
    // 1) Izračunaj redosled
    let route = nearestNeighbor(startIdx);
    route = twoOpt(route);
    trenutnaRuta = route;
    const dist = routeDistance(route);
    ukupnaDistanca = dist;

    routeLayer.clearLayers();
    dodajBrojeveNaRutu(route);
    popuniListu(route);

    document.getElementById('stats').innerHTML =
      `✅ <b>Ruta izračunata</b><br>
       Start: <b>Lastva Grbaljska</b><br>
       Objekata: <b>${route.length}</b><br>
       Vazdušna distanca: <b>${dist.toFixed(1)} km</b><br>
       <i>Učitavam put preko OSRM...</i>`;

    // 2) Pokušaj OSRM
    try {
      const coords = await fetchOSRMRoute(route);
      nacrtajRutuOSRM(coords);
      // Izračunaj stvarnu dužinu rute po putevima
      let roadDist = 0;
      for (let i = 1; i < coords.length; i++) {
        roadDist += haversine(
          {lat: coords[i-1][0], lon: coords[i-1][1]},
          {lat: coords[i][0], lon: coords[i][1]}
        );
      }
      document.getElementById('stats').innerHTML =
        `✅ <b>Ruta izračunata</b><br>
         Start: <b>Lastva Grbaljska</b><br>
         Objekata: <b>${route.length}</b><br>
         Vazdušna distanca: <b>${dist.toFixed(1)} km</b><br>
         Procenjena putna distanca: <b>~${roadDist.toFixed(0)} km</b>`;
    } catch (err) {
      console.warn('OSRM greška:', err);
      nacrtajRutuPraveLinije(route);
      document.getElementById('stats').innerHTML =
        `⚠️ <b>OSRM nedostupan</b> — prikazane prave linije<br>
         Start: <b>Lastva Grbaljska</b><br>
         Objekata: <b>${route.length}</b><br>
         Vazdušna distanca: <b>${dist.toFixed(1)} km</b>`;
    }
  } catch (err) {
    alert('Greška: ' + err.message);
  } finally {
    loading.style.display = 'none';
  }
};

document.getElementById('btnLine').onclick = () => {
  if (!trenutnaRuta.length) { alert('Prvo izračunaj rutu.'); return; }
  routeLayer.clearLayers();
  nacrtajRutuPraveLinije(trenutnaRuta);
  dodajBrojeveNaRutu(trenutnaRuta);
};

document.getElementById('btnClear').onclick = () => {
  routeLayer.clearLayers();
  trenutnaRuta = [];
  document.getElementById('routeList').innerHTML = '';
  document.getElementById('stats').textContent = 'Ruta nije izračunata.';
};

document.getElementById('btnGmaps').onclick = () => {
  if (!trenutnaRuta.length) { alert('Prvo izračunaj rutu.'); return; }
  // Google Maps podržava ~10 tačaka; pravimo link sa prvih 10
  const first = trenutnaRuta.slice(0, 10).map(i => `${tacke[i].lat},${tacke[i].lon}`).join('/');
  const url = `https://www.google.com/maps/dir/${first}`;
  navigator.clipboard.writeText(url).then(() => {
    alert('Kopiran link za prvih 10 tačaka u Google Maps:\n\n' + url);
  }).catch(() => {
    prompt('Kopiraj link:', url);
  });
};
